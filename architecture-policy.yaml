# Relationships the self-test asserts INSTEAD OF a constant, for the rules whose
# count is expected to move as the codebase grows.
#
#   sum:    rules whose counts are added together
#   equals: the quantity that sum must match
#
# `architecture-check.mjs` evaluates each entry and fails the self-test if the
# two sides differ. The check is meaningful rather than tautological because it
# is NOT the same computation as the counting: `module-dependency` and
# `module-dependency-permitted` are assigned per edge by
# `moduleDependencyPermitted()`, while the right-hand side is the raw edge count
# the audit reported. An edge that escaped classification, or was counted on
# both sides, breaks it.
selfTestRelations:
  # 380 + 375 = 755, measured against 755 cross-boundary edges on
  # `origin/master` @ 2902d8aa. Every cross-boundary edge is classified as
  # exactly one of permitted / not-permitted, so this is the property that was
  # actually true all along; the 375 constant was a weaker, brittle
  # restatement of it.
  - id: permitted-plus-blocking-covers-every-edge
    sum: [module-dependency, module-dependency-permitted]
    equals: crossBoundaryEdges

