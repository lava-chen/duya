# Architecture boundary policy (plan 584 PP-0, task 0.1)
#
# Enforced by scripts/architecture/architecture-check.mjs.
# Design source: docs/architecture/05-architecture-governance.md §2.
#
# ── Strategy: progressive enforcement ──────────────────────────────────────
#
# `managedOnly: true` + every legacy module `managed: false` means the
# checker BLOCKS on two things and nothing else:
#
#   1. any violation inside a `managed: true` module   (zero tolerance)
#   2. any violation whose fingerprint is not in .architecture-baseline.json
#
# Everything already in the baseline is tolerated debt. Each migration step
# flips one module to `managed: true` and deletes that module's fingerprints
# from the baseline, so the debt is paid down monotonically instead of being
# cleaned up in one unreviewable sprint.
#
# The baseline is a RATCHET, not a wish list. A strict gate over ~800
# pre-existing violations would be permanently red, and a permanently red gate
# gets ignored — the same failure mode that let ~898 unchecked electron type
# errors and a never-firing CI workflow reach master.

version: 1

global:
  # Fail on new violations only. The baseline absorbs the legacy ones.
  baselineFile: .architecture-baseline.json

  # Only `managed: true` modules get zero-tolerance enforcement. Unmanaged
  # modules are still measured, still reported, and still blocked on growth —
  # they just may carry baselined debt.
  managedOnly: true

  # Every rule below that is not explicitly switched off is evaluated.
  rules:
    module-dependency: true
    forbidden-dependency: true
    package-boundary-escape: true
    deep-import: true
    cycle: true
    missing-module-artifact: true

    # ── Not yet enabled: these have no reproducible baseline yet. ──────────
    # Enabled as a follow-up once each can be counted deterministically, so the
    # baseline never has to absorb a number we cannot reproduce.
    #   max-file-lines              (05 §3 marks it 待测)
    #   max-contract-lines          (05 §3 marks it 待测)
    #   max-public-methods          (05 §3 marks it 待测)
    #   layer-direction             (05 §3 marks it 待测)
    #   domain-io                   (needed by plan 584 drift test #1 as well)
    #   ui-implementation-import    (05 §3 says 23; not re-verified yet)
    #   disallowed-process-spawn    (05 §3.1 says "50+", which is not a count)

# ── Dependency layers: a module may only depend downward ───────────────────
layers:
  - protocol # agent-protocol, shared
  - core # agent-core, agent-tools, ai
  - runtime # agent-runtime
  - host # desktop, cli, gateway
# harness/ lives outside the workspace and is validated separately (05 §4.4).

# ── Edges forbidden regardless of what `requires` says ─────────────────────
forbiddenDependencies:
  - from: packages/agent-protocol/**
    to:
      - packages/agent-core/**
      - packages/agent-runtime/**
      - electron/**
      - src/**
    reason: >-
      protocol must be a true leaf with zero implementation dependencies.
      grok's sampling-types claimed "no I/O" while its Cargo.toml pulled in
      reqwest plus 16 internal crates (02-reference-repo-boundaries.md:271-280).

  - from: packages/agent-core/**
    to:
      - electron/**
      - apps/desktop/**
      - src/**
      - packages/computer-use/**
    reason: agent-core must not depend on any host (16 measured violations).

  - from: src/**
    to:
      - electron/**
      - apps/desktop/src/main/**
    reason: renderer must not depend on the main process (9 measured violations).

  # Not in 05 §2's list, but it is the single largest boundary problem in the
  # repo (01-current-state-audit.md 核心结论 #6: 57 edges, 24 of them from the
  # provider layer) and plan 06 stage M3 exists to remove it. Added here so a
  # NEW main->renderer edge is blocked while the debt is burned down.
  - from: electron/**
    to:
      - src/**
      - apps/desktop/src/renderer/**
    reason: >-
      the main process must not depend on renderer types. 57 measured edges;
      the provider layer alone accounts for 24. This is the direction that is
      backwards today, and 06 stage M3 (packages/shared) is what unwinds it.

  - from: packages/**
    to:
      - electron/**
      - src/**
      - apps/desktop/**
    reason: >-
      workspace packages must not depend back on the host
      (57 measured violations; these are what plan 584 PP-3/PP-11 remove).

  - from: packages/agent-*/
    to:
      - packages/ui/**
      - packages/conductor/**
    reason: agent must not depend on UI (2 measured violations).

# ── Capability edges that are explicitly permitted ─────────────────────────
allowedDependencies:
  - from: packages/agent-runtime/**
    to:
      - packages/plugin-core/**
      - packages/computer-use/**
      - packages/ai/**

# ── Module declarations ────────────────────────────────────────────────────
modules:
  # ── Target state: declared now so the rules bind the moment the directory
  #    appears. The directories do not exist yet (plan 584 PP-1 creates
  #    agent-protocol); a root that does not exist simply matches nothing.
  - id: agent-protocol
    roots: [packages/agent-protocol]
    managed: true # zero tolerance from the first commit
    requires: []
    publicEntrypoints: [packages/agent-protocol/src/index.ts]
    owner: agent-harness

  - id: agent-core
    roots: [packages/agent-core]
    managed: true
    requires: [agent-protocol, ai]
    publicEntrypoints: [packages/agent-core/src/index.ts]
    owner: agent

  - id: agent-runtime
    roots: [packages/agent-runtime]
    managed: true
    requires: [agent-protocol, agent-core, agent-tools, ai, plugin-core]
    publicEntrypoints: [packages/agent-runtime/src/index.ts]
    owner: agent

  # ── Legacy: managed: false, each flipped as its migration lands ─────────
  - id: legacy-agent
    roots: [packages/agent]
    managed: false
    requires: []
    owner: agent
    migrateTo: agent-core

  - id: legacy-desktop
    roots: [src, electron]
    managed: false
    requires: []
    owner: desktop
    migrateTo: apps/desktop

  - id: legacy-plugin-core
    roots: [packages/plugin-core]
    managed: false # becomes true at plan 584 / 06-M1
    requires: []
    publicEntrypoints: [packages/plugin-core/src/index.ts]
    owner: extensibility

  - id: legacy-ai
    roots: [packages/ai]
    managed: false
    requires: []
    owner: agent

  - id: legacy-cli
    roots: [packages/cli]
    managed: false
    requires: []
    owner: agent

  - id: legacy-gateway
    roots: [packages/gateway]
    managed: false
    requires: []
    owner: platform

  - id: legacy-conductor
    roots: [packages/conductor]
    managed: false
    requires: []
    owner: canvas

  - id: legacy-computer-use
    roots: [packages/computer-use]
    managed: false
    requires: []
    owner: os

  - id: legacy-voice
    roots: [packages/voice]
    managed: false
    requires: []
    owner: voice

# ── Self-test expectations ─────────────────────────────────────────────────
#
# `--self-test` asserts the checker can count every known violation. A mismatch
# means the resolver has a hole, not that the codebase got cleaner.
#
# MEASURED at master @ b6f8e7c0 (2026-10-01), not copied from the docs.
# 05-architecture-governance.md §5 still quotes the 7c5bf050-era numbers and
# they have since drifted — cross-boundary 568 -> 567, escapes 161 -> 153,
# unresolved 34 -> 41. That drift is exactly why this block lives in the
# policy, where it is re-measurable, instead of in prose.
#
# Recompute with:
#   node scripts/architecture/audit-imports.mjs
#   node scripts/architecture/audit-modules.mjs
selfTest:
  module-dependency: 567
  forbidden-dependency: 82
  package-boundary-escape: 153
  deep-import: 117
  cycle: 18
  missing-module-artifact: 1
