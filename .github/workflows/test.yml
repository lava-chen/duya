name: Test

on:
  push:
    # Plan 583 ISS-01: this workflow previously watched `main`/`develop`,
    # neither of which exists in this repository — `origin/HEAD` is
    # `master`, and `gh pr create --base master` is the documented flow in
    # AGENTS.md. The triggers therefore never matched and the workflow never
    # ran, which is how a P0 type error and a P0 build break both reached
    # master.
    #
    # Plan 587 G0.2 correction: `main`/`develop` are now DROPPED instead of
    # being kept "in case they are ever created". A branch in a trigger list
    # is a claim that the branch is a live review target; neither branch
    # exists, so the claim was false, and a false claim in a file people read
    # to answer "what does CI run on?" is worse than no claim. Re-adding one
    # is a one-line diff on the day the branch is actually created.
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Cross-platform regression signal without charging every merge for the full matrix.
    - cron: '20 10 * * *'
  # Manual trigger: the Electron E2E suite is no longer part of the PR path
  # (see the E2E step below), so this is how it gets run on demand.
  workflow_dispatch:

# Keep the scheduled run independent so a new push cannot cancel the nightly
# cross-platform signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Architecture boundary gate ────────────────────────────────────────────
  # Standalone job. It is `needs`-free, so it reports independently of the
  # (currently red) test matrix instead of being skipped by it.
  #
  # Runs on ONE OS deliberately: this is pure static analysis over the
  # source tree — no compile, no native module, no OS-specific behaviour.
  # Measured locally at ~3s per invocation, against a 3-OS `npm ci` + typecheck
  # matrix measured in minutes. Three copies would buy no extra signal.
  architecture:
    name: architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `fetch-depth: 0` is required by the resolver-change detection
          # below, which diffs against the event's base sha. This is the only
          # job that pays for full history, and it is the cheapest job here.
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Frozen baselines may shrink as debt is removed, but a PR must never
      # make an existing architecture or retirement gate more permissive.
      - name: Baseline ratchet
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASELINE_BASE_SHA="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ -z "$BASELINE_BASE_SHA" ] || \
             [ "$BASELINE_BASE_SHA" = "0000000000000000000000000000000000000000" ] || \
             ! git cat-file -e "${BASELINE_BASE_SHA}^{commit}" 2>/dev/null; then
            BASELINE_BASE_SHA="$(git rev-parse HEAD^)"
          fi
          npm run architecture:baseline-ratchet -- "$BASELINE_BASE_SHA"

      # No built `dist/` is required. Measured on a clean checkout with every
      # `dist/` absent: `architecture:check` exits 0 (802 total / 802
      # tolerated / 802 baseline) and `architecture:self-test` exits 0. The
      # resolver works from the *declared* `exports` maps in each
      # `package.json`, not from built artifacts, so this job must NOT build
      # first — building here would only add minutes and hide a future
      # accidental dist dependency behind a slow cache hit.
      - name: Architecture boundary check
        # This is the gate's verdict. Exit 1 = new violations; the message
        # names the file, the rule and the reason.
        run: npm run architecture:check

      - name: "Guard: the check must have scanned something"
        # `architecture-check.mjs` exits 0 whenever `blocking.length === 0`,
        # which is ALSO true when it scanned nothing at all — e.g. if a
        # future refactor breaks the module-root matcher so every file maps to
        # no module, `total` collapses to 0 and the gate reports "OK — no new
        # boundary violations" while enforcing nothing. A gate that cannot
        # tell "clean" from "blind" is the exact failure this repo already
        # paid for once. So assert a non-zero scan.
        #
        # Runs even when the step above failed (`always()`), but only fires on
        # a zero scan: when the real check fails on new violations `total` is
        # still > 0, so this adds no second, confusing red signal.
        if: always()
        run: |
          node <<'EOF'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          // `--json` exits 1 when it FOUND blocking violations, and 2 when the
          // engine itself failed. Status 1 is the normal outcome of a real gate
          // failure — the check step above is already red for it — so the guard
          // must report the counts and then stay out of the way rather than
          // pile on a second, vaguer failure.
          let report = null;
          let engineFailed = false;
          try {
            report = JSON.parse(execFileSync(
              'node',
              ['scripts/architecture/architecture-check.mjs', '--json'],
              { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024 },
            ));
          } catch (err) {
            // Non-zero exit still prints a JSON report on stdout; recover it.
            try {
              report = JSON.parse((err.stdout ?? '').toString());
            } catch {
              engineFailed = true;
            }
          }
          if (!report) {
            process.stdout.write('guard: --json produced no report; deferring to the check step.\n');
            process.exit(0);
          }
          const total = report.total ?? 0;
          const summary = [
            '### architecture:check',
            '',
            '| metric | value |',
            '| --- | --- |',
            `| violations found | ${total} |`,
            `| tolerated (baselined) | ${report.tolerated} |`,
            `| new (blocking) | ${report.blocking} |`,
            `| baseline size | ${report.baselineSize} |`,
            '',
            ...Object.entries(report.counts ?? {}).map(([rule, n]) => `- \`${rule}\`: ${n}`),
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY ?? 'guard-summary.md', summary + '\n');
          process.stdout.write(summary + '\n');
          if (engineFailed) {
            process.stderr.write('\nguard: architecture-check engine failed; deferring to the check step.\n');
            process.exit(0);
          }
          if (report.blocking > 0) {
            // Real violations, already reported by the check step. Do not
            // duplicate the failure.
            process.stdout.write('guard: new violations present; the check step is the verdict.\n');
            process.exit(0);
          }
          if (total === 0) {
            process.stderr.write(
              '\nguard FAILED: architecture:check found 0 violations, so it proved nothing.\n' +
              'A clean scan and a blind scan look identical here. Treat this as a\n' +
              'resolver failure (scripts/architecture/), not as a clean repo.\n',
            );
            process.exit(1);
          }
          EOF

      - name: Slice graph and audit-imports parity
        run: npm run architecture:slice-graph

      # Existing retirement references are frozen in a non-regression count
      # baseline. This gate remains green while the package is open and turns
      # red only when a reference is added.
      - name: Agent retirement reference ratchet
        run: npm run agent-retirement-gate

      # Plan 610 S4c-d3. `architecture:boundaries` (scripts/architecture/
      # boundary-gates.mjs) is a SEPARATE gate with a SEPARATE baseline
      # (`boundary-gates-baseline.json`) and it had a `package.json` script that
      # no CI job ever called — so G7's verdict was computed locally and never
      # enforced. It is wired here now.
      #
      # Placed AFTER the `architecture:check` guard rather than beside it, and
      # that is not cosmetic: the guard exits 1 when the check scanned nothing,
      # and a step inserted between the check and its guard would mean the guard
      # reported on a check that had already been superseded by a different gate.
      #
      # Exit contract: 1 when a finding's fingerprint is absent from
      # `boundary-gates-baseline.json`. No `--write` here, ever — the gate is
      # only meaningful while the baseline is frozen and reviewed by a human.
      #
      # NOT gated on the resolver-change step below, deliberately. That step
      # exists because `architecture:self-test` compares live counts against a
      # frozen snapshot, so it may only fire when the resolver or its
      # expectations move. This gate's baseline is a list of fingerprints, not a
      # count, so an ordinary source change that adds a violation must fail
      # immediately rather than wait for a resolver edit to reveal it.
      - name: Architecture plan-600 boundary gates
        run: npm run architecture:boundaries

      - name: Detect architecture resolver changes
        id: resolver
        run: |
          set -uo pipefail
          PATTERN='^(scripts/architecture/|architecture-policy\.yaml$|\.architecture-baseline\.json$)'
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          changed=false
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -Eq "$PATTERN"; then
              changed=true
            fi
          else
            # Base sha unusable (first push to a new branch, force-push,
            # shallow ref). Run the gate rather than silently skip it.
            changed=true
          fi
          echo "resolver-changed=$changed" >> "$GITHUB_OUTPUT"
          echo "resolver changed: $changed"

      # `architecture:self-test` is NOT run unconditionally, and that is a
      # deliberate choice rather than a shortcut. It compares the resolver's
      # live counts against a frozen snapshot in architecture-policy.yaml
      # (548/35/16/162/25/16/0). Any legitimate debt paydown — which is the
      # entire point of the ratchet, and what every plan-587 migration step
      # does — lowers a count and therefore turns an unconditional self-test
      # red until a human recomputes the snapshot. Gating on resolver-file
      # changes keeps the assertion meaningful (it fires exactly when the
      # resolver or its expectations move) without punishing real progress.
      - name: Architecture resolver self-test
        if: steps.resolver.outputs.resolver-changed == 'true'
        run: npm run architecture:self-test

      # ---------------------------------------------------------------------
      # G10 + A1: gates that existed, had unit tests, and ran in CI's vitest
      # (vitest.config.ts includes `scripts/**/*.test.ts`) -- but were NEVER
      # EXECUTED as gates. `browser-closure-gate.mjs` had no package.json
      # script at all; `headless-load-gate.mjs` had one that nothing called.
      # A gate whose only CI presence is its own unit test is evidence that
      # the gate's LOGIC is correct, and no evidence that anyone is watching
      # the tree it guards. The window was open: plan 610 A0 measured the
      # browser closure at 0/789 built-ins and that number was produced by a
      # human running a script by hand.
      #
      # They run here, in the existing `architecture` job. G10 reads the source
      # graph; A1 also bundles and loads the Desktop CLI handler closure, so its
      # Host dependency artifacts must be built in this clean checkout.
      #
      # Plan-600 gates G1-G9 run separately above with their own fingerprint
      # baseline. This block runs the source-closure checks G10 and A1.
      # ---------------------------------------------------------------------
      - name: Browser entry closure (G10)
        run: npm run architecture:browser-closure

      - name: Build Host dependency closure for A1
        run: node scripts/build-packages.mjs --target @duya/host

      - name: Headless load of the cli handler layer (A1)
        run: npm run architecture:headless

      # T14b. These two shipped in #277 and nothing ever ran them: the PR said
      # so itself ("Not in this PR"), and a grep of `.github/workflows` found no
      # reference to either script. A gate with no runner is a comment that costs
      # a runner to write.
      #
      # `client-closure` is the one that holds `packages/cli/src/chat.ts` free of
      # the execution engine — the edge a future web or desktop client is built
      # on, so it is exactly the gate that must not rot. It exits non-zero on a
      # forbidden edge, and the gate's own tests cover the degenerate cases.
      - name: Client entry closure (G11-1)
        run: npm run architecture:client-closure

      # The bundle is tracked, so a source edit that is never rebuilt is a lie
      # the next reader has to discover. This compares the committed bundle
      # against every first-party input changed since the bundle commit; it does
      # not build, so it runs before the A1 step above has anything to do with it.
      - name: Worker bundle freshness (bundle:verify)
        run: npm run bundle:verify

      # T02. Plan 19 §11 calls itself the single source of truth for card status,
      # and 19 §4 rule 4 says a card is done when it has a named test. That was
      # an honour system, and it failed visibly on 2026-10-18: two cards read
      # `todo` after landing (#277, #279), and two more carried failure evidence
      # that no longer reproduced. All four were found by hand.
      #
      # The checker also refuses to pass when it finds no verifiable test names,
      # so a table that quietly stops carrying evidence shows up as a failure
      # rather than as a gate that agrees with everything.
      - name: Plan tracking table matches the tree (T02)
        run: npm run plan:sync

      # The rules-compliance checker is the gate that keeps AGENTS.md / CLAUDE.md
      # honest: it asserts every package ships a rule file of at least 200 bytes
      # and that every path those files cite still resolves. It was wired to
      # `npm run test:rules`, but no workflow ever called it — so the 24 package
      # guides added in #317 had no automated check at all, and neither did the
      # `path:line` references the docs are built around.
      #
      # Its own staleness rule reads file mtimes, and a fresh CI checkout stamps
      # every file with the checkout time, so that rule is a no-op here by
      # construction. The other five rules are real assertions, and none of them
      # touches the network: the LLM call lives behind LIVE=1, which CI never sets.
      - name: Rule files reference paths that still exist
        run: npm run test:rules

      # Both gates decide "clean" by a count being zero, and a count is also
      # zero when the walk followed nothing. These are guards, not second
      # verdicts: they never re-decide whether the gate passes, only whether it
      # looked at anything. A red gate with a non-empty scope fails the step
      # above and passes this one; a green gate over an empty scope fails here.
      # Same reasoning as the `architecture:check` guard above, applied to the
      # two gates that were about to be promoted without it.
      - name: "Guard: G10 must have scanned something"
        if: always()
        run: node scripts/architecture/gate-scan-guard.mjs g10

      - name: "Guard: A1 must have scanned something"
        if: always()
        run: node scripts/architecture/gate-scan-guard.mjs a1

  # ── Resolve changed-file scopes once for both test and build jobs ─────────
  changes:
    name: test scope
    runs-on: ubuntu-latest
    outputs:
      unit_scope: ${{ steps.resolve.outputs.unit_scope }}
      e2e_scope: ${{ steps.resolve.outputs.e2e_scope }}
      build_scope: ${{ steps.resolve.outputs.build_scope }}
      e2e_files: ${{ steps.resolve.outputs.e2e_files }}
      unit_files: ${{ steps.resolve.outputs.unit_files }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Resolve test scope
        id: resolve
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # For pull_request events, github.sha is a synthetic merge commit.
          # Diff the PR's own head so commits newly merged to master are not
          # misclassified as changes from this PR.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run ci:test-scope

  # ── Typecheck (static analysis) ──────────────────────────────────────────
  # Split out of the `test` job on 2026-10-21.
  #
  # `typecheck:all` is pure static analysis: `tsc --noEmit` over the workspace,
  # plus the repo's own check:* gates. It shares no state with the test suite
  # and never observes a test result, so running it in the same job as the
  # tests only means the two wait for each other.
  #
  # Measured on run 39617841005 (PR #343): the `test` job spent 7m15s in
  # `typecheck:all` and 13m26s in vitest, for a 21m51s job. The typecheck
  # half was dead time on the critical path — the suite could not start until
  # every tsc had finished, and every tsc had to wait for the suite to be
  # scheduled. As its own job it runs CONCURRENTLY with the tests, so the
  # critical path is whichever of the two takes longer, not their sum.
  #
  # Both jobs build the workspace (`build:packages`), because a job's `dist/`
  # does not cross a job boundary. That is deliberate: the two builds run at
  # the same time, which is strictly faster than one build that both jobs
  # queue behind.
  typecheck:
    name: typecheck
    if: >-
      github.event_name != 'push' &&
      needs.changes.outputs.build_scope != 'skip'
    needs: changes
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        # The renderer's `tsc --noEmit` aborts the Node process with
        # `Abort trap: 6` (exit 134) on the macOS runner under the default
        # heap — a V8 out-of-memory, not a type error. ubuntu passes the same
        # step with the default heap, so this is runner memory, not code.
        # Same remedy AGENTS.md already documents for `typecheck:cli`.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck:all

  # ── Typecheck + tests ─────────────────────────────────────────────────────
  test:
    if: >-
      github.event_name != 'push' &&
      (needs.changes.outputs.unit_scope != 'skip' || needs.changes.outputs.e2e_scope != 'skip')
    needs: changes
    runs-on: ${{ matrix.os }}

    strategy:
      # Without this, the default `fail-fast: true` cancels the other legs the
      # moment one OS fails, and a cancelled leg is reported as `cancelled` —
      # not `passed`, but it reads like an absence of evidence rather than a
      # result, and a half-cancelled matrix is easy to misread as "only the
      # broken OS is broken". The scheduled matrix keeps each platform leg
      # running to a real result even when another platform fails.
      fail-fast: false
      matrix:
        # PRs get one Linux leg; scheduled runs own the full cross-platform suite.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build workspace packages
        if: needs.changes.outputs.build_scope != 'skip'
        # The `typecheck` job builds the workspace too, but a job's `dist/`
        # does not cross a job boundary — and the suite resolves the
        # workspace packages that are not aliased to source (`@duya/ai`,
        # `@duya/cli`, `@duya/computer-use`, `@duya/gateway`,
        # `@duya/input-completion`, `@duya/voice`) through their `exports`
        # maps, which point at `dist/`. Without this build those imports
        # resolve to nothing and the suite fails at import time.
        #
        # It builds the `unit-suite` PROFILE rather than the whole workspace:
        # the profile is the set of packages the unit suite resolves from
        # `dist/`, and the rest of the workspace is either aliased to source
        # by vitest or not imported by the suite at all. Measured on this tree
        # from a clean `dist/` and a clean `tsconfig.tsbuildinfo`:
        #
        #   full build (22 packages)   151.8s
        #   unit-suite profile (19)     39.8s
        #
        # On the CI runner the same change measured 166s -> 64s (runs
        # 39639233610 and 39659948364).
        #
        # The packages the profile leaves out are the expensive ones: `@duya/ui`
        # is a full `tsc` project over the renderer, and the unit suite
        # resolves it from source, not from `dist/`.
        #
        # Two jobs building at the same time is FASTER than one build both
        # jobs queue behind: the build is on the critical path of each job
        # independently, so overlapping them overlaps the waiting too.
        #
        # The heap ceiling is the one the typecheck step has always carried:
        # the renderer's `tsc --noEmit` aborts with `Abort trap: 6` (exit
        # 134) on the macOS runner under the default heap, and the build step
        # runs that same typecheck. It used to inherit the ceiling from the
        # typecheck step this build sat inside.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/build-packages.mjs --profile unit-suite

      # The native SQLite binding is built for ONE runtime at a time, and
      # `npm ci` left it built for Electron (the `postinstall` hook runs
      # `electron-builder install-app-deps`). The unit suite runs under Node,
      # so the binding has to be swapped for the Node ABI before the suite
      # starts. This is the half of the old `pretest` hook that is still
      # required here — the other half was a second workspace build, and that
      # is what the step below explains.
      - name: Prepare the native SQLite binding for Node
        run: node scripts/ensure-sqlite-abi.mjs node

      - name: Run tests
        if: needs.changes.outputs.unit_scope != 'skip'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -o pipefail
          # File-level parallelism is ON, and the worker count is pinned.
          #
          # This step used to pass `--no-file-parallelism`, which serialised
          # ~1,460 test files: the full suite took 34 minutes on the runner.
          # The stated reason for the serial flag was "stable temporary test
          # namespaces", but the suites that use a fixed path are a handful
          # (most use `fs.mkdtemp`, which is unique per call). Measured on a
          # 20-core dev machine, the same files take 23 minutes serial and
          # 4-5 minutes concurrent, and the two runs fail the same files —
          # except for one 30,000-delta simulation that the default 10s
          # `testTimeout` could not hold; it now carries an explicit budget.
          #
          # `--maxWorkers=2` stays, and this was measured rather than assumed.
          #
          # Four workers WERE tried, on the theory that the runner has four
          # vCPUs. The suite got 13% faster (633s -> 553s of wall clock) and
          # three suites went red that had been green: `run-resource-growth`
          # (a timer handle that had already been released when the snapshot
          # was taken), `subprocess-framing` (frames still in flight when the
          # pipe was closed) and `transport-equivalence` (a child that had not
          # finished starting). All three are "the subprocess or the timer had
          # not settled yet", which is what a busier runner produces.
          #
          # The reason four workers bought so little is in the numbers: the
          # suite's own test bodies total 391s of CPU across 1,175 files, and
          # everything else is per-file overhead — 255s collecting modules,
          # 99s setting up, 108s preparing. That overhead is per WORKER, so
          # four workers do not divide it: they quadruple it and then divide
          # the result by four. Measured, the per-file overhead grew 1.7-1.8x
          # (collect 255s -> 463s, setup 99s -> 168s, prepare 108s -> 180s)
          # as the worker count doubled, and that inflation ate almost the
          # whole parallel gain. The runner does not have four idle cores to
          # hand out.
          #
          # So the wall clock here is dominated by PER-FILE OVERHEAD, not by
          # the tests. Cutting it means cutting what a file costs to collect,
          # which is a different piece of work — and the two files that would
          # move it most are named below.
          #
          # `npx vitest run` rather than `npm test`: `npm test` runs the
          # `pretest` hook, and `pretest` is `bundle:agent` — which is
          # `build:packages` PLUS a rebuild of the worker bundle. On the
          # reference run (PR #343, run 39639233610) that hook spent 145s of
          # the 648s this step reports, rebuilding a workspace the step above
          # had already built, minute for minute.
          #
          # The bundle half is redundant for a second reason: `packages/host/
          # bundle/` is a TRACKED artifact (57 files), so the checkout already
          # carries it, and the `architecture` job's `bundle:verify` gate
          # asserts that the committed bundle still matches the source it was
          # built from — by reading git history, not by rebuilding. A stale
          # bundle is therefore already a red PR, and the test job was
          # rebuilding past that red instead of reporting it.
          #
          # `npm test` itself is unchanged for local use: the hook still
          # builds the bundle there, where nothing else has built it.
          WORKERS=2
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${{ needs.changes.outputs.unit_scope }}" = "changed" ]; then
            mapfile -t unit_files < <(node -e 'for (const file of JSON.parse(process.argv[1])) console.log(file)' '${{ needs.changes.outputs.unit_files }}')
            if [ "${#unit_files[@]}" -eq 0 ]; then
              echo "Changed unit scope has no test or source targets; refusing to silently skip tests" >&2
              exit 1
            fi
            if [ "${{ needs.changes.outputs.build_scope }}" = "skip" ]; then
              npx vitest run --maxWorkers="$WORKERS" "${unit_files[@]}" 2>&1 | tee vitest-output.log
            else
              npx vitest run --changed="$BASE_SHA" --maxWorkers="$WORKERS" 2>&1 | tee vitest-output.log
            fi
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            npx vitest run --coverage --maxWorkers="$WORKERS" 2>&1 | tee vitest-output.log
          else
            npx vitest run --maxWorkers="$WORKERS" 2>&1 | tee vitest-output.log
          fi

      # Plan 610 T04 / G10. This guard used to be an inline heredoc that exited
      # 1 whenever it could not find the vitest summary line. That made the `test`
      # job red on every commit of master — run 39040547246, and PR #275's run
      # 39044714745 carry the same line — with `collected: UNKNOWN`: a verdict
      # about the guard's own parsing wearing the costume of a suite failure. With
      # known-red tests on master, a job that is red for an unrelated reason
      # cannot tell debt from a new regression, so its answer is unusable.
      #
      # The real cause, measured on those two job logs: there is NO summary block
      # to read. `grep -c passed` is 0 in both — vitest's summary always says
      # "passed" — because the run dies in an unhandled rejection inside the
      # vitest pool before the reporter prints. The log really does contain ~43k
      # ESC bytes and 0 literal `^[[` sequences, so "the writer stripped ESC"
      # was not the cause either; the parser accepts both spellings anyway,
      # because a guard that rejects an encoding it has not seen reports nothing.
      #
      # The exit contract now lives in `scripts/ci/test-summary-guard.mjs` and is
      # covered by `scripts/ci/test-summary-guard.test.ts`, whose fixtures are
      # byte-exact captures of those runs. `unread` exits 0: whether the suite
      # passed is decided by the exit code of the `Run tests` step above, which
      # `set -o pipefail` already propagates. Only a genuinely zero-collection run
      # fails here — that one really is a suite failure wearing the guard's name.
      - name: "Guard: tests must actually be collected"
        # Vitest already fails when zero test FILES match, but "files matched
        # and zero tests ran" is still reachable — every file skipped, or an
        # include-glob change that only ever matches empty files. That exits 0
        # and looks identical to a healthy run. Assert the collected totals
        # are non-zero, so this job cannot go green by collecting nothing.
        #
        # T04b: this step used to carry an INLINE copy of the guard while
        # `scripts/ci/test-summary-guard.mjs` held the real one — and the two
        # disagreed about both failure branches. The inline copy exited 1 on
        # `unread` (failing the job over its own parse failure) and 0 on
        # `no-log` (passing a job whose log was never written). CI ran the
        # inline copy, so correcting the script changed nothing about this job
        # — which is why `guard FAILED: could not read the vitest summary
        # line.` kept appearing no matter what the script said. There is one
        # implementation now, and the workflow calls it.
        # What this step deliberately does NOT do any more is fail on "could not
        # parse". See the exit contract in the script.
        if: always() && needs.changes.outputs.unit_scope != 'skip'
        shell: bash
        run: node scripts/ci/test-summary-guard.mjs vitest-output.log

      - name: Upload coverage to Codecov
        if: github.event_name == 'schedule' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  # ── Build / packaged parity ───────────────────────────────────────────────
  build:
    if: github.event_name != 'push' && needs.changes.outputs.build_scope != 'skip'
    needs: [architecture, changes]
    runs-on: ${{ matrix.os }}
    # Plan 587 G0.2: this was `needs: test`, and because `npm test` is red the
    # whole build job was SKIPPED — so `electron:build` and the macOS packaged
    # parity check have produced no CI evidence on any recent SHA, on any OS.
    # `needs:` in CI is a sequencing device, not a gate: its only effect here
    # was to suppress the job permanently.
    #
    # Chosen shape: depend on `architecture` instead. Rationale and cost:
    #   * We want `electron:build` evidence regardless of test debt.
    #   * We still want SOME cheap upstream, so a broken boundary stops us
    #     burning the build matrix. `architecture` is the right pick: it is
    #     ~3s of static analysis, needs no `dist/`, and a boundary violation
    #     genuinely means the build is building something wrong.
    #   * What this costs: `build` no longer runs after the tests, so a
    #     test-only regression will not gate the build job. The test job stays
    #     visible and independent; the platform matrix runs on the schedule.

    strategy:
      # PRs build on Ubuntu only; the scheduled matrix retains Windows/macOS
      # packaging and parity evidence without repeating it after every merge.
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        # `vite build` aborts with `Abort trap: 6` (exit 134) on the macOS
        # runner under the default ~2 GB V8 heap — runner memory, not a build
        # error; ubuntu and windows pass this identical step at the default
        # heap. Same value and same reasoning as the release workflow's
        # identical step (release.yml), and as this job's typecheck step
        # above (5bf3220a). Raise it for all platforms so one value works
        # across the matrix.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run electron:build

      - name: First-screen JS budget
        # The bytes of JavaScript the renderer must download and evaluate
        # before the first screen can paint.
        #
        # This is the sprint's first machine-INDEPENDENT performance gate.
        # Wall-clock thresholds cannot gate a shared runner, so they stay out
        # of CI and live in the plan document as trends; bytes are the same on
        # every machine, so a budget is a real gate.
        #
        # It catches the regressions that matter for the first screen: a
        # barrel file that drags a provider SDK back into the entry chunk, an
        # import that used to be lazy becoming static, a dependency that
        # grew. The budget is one-sided — an improvement never fails it — and
        # it is tightened by hand after a measured win, the way the
        # architecture baselines are ratcheted.
        #
        # The step reads the build output of the step above; it launches
        # nothing, so it costs a fraction of a second.
        run: npm run perf:first-screen-budget

      - name: Run affected Electron E2E tests
        # The Electron E2E suite is OFF the pull-request path.
        #
        # Why: it cannot currently produce a usable signal on a PR. The suite
        # is 18 specs across 5 Playwright projects, each one starting a REAL
        # Electron main process (`workers: 1`, `fullyParallel: false`), and it
        # takes ~17 minutes. On the reference run (PR #333) it produced 17
        # failures; after the fixes in this branch it still produces 15, and
        # every one of them fails the same way — `expect(locator).toBeVisible()`
        # timing out after ~13s — which says the renderer never became
        # interactive, not that the product misbehaved.
        #
        # A red job that cannot distinguish "your change broke it" from "it was
        # already red" is not a gate; it is noise that costs every author
        # 17 minutes per push and trains everyone to ignore the job. The
        # failure count also moved between reference runs (17 -> 15) while
        # this branch changed no E2E product code, which is the signature of
        # an unstable environment rather than a regression signal.
        #
        # What this keeps: the suite still runs on the nightly schedule and on
        # a manual `workflow_dispatch`, so a real break is still caught, and
        # the trace files are still retained for whoever reads them. What it
        # gives up: E2E no longer blocks a PR merge.
        #
        # The E2E suite is being rebuilt (the current work is TUI-first), so
        # this is a deliberate "not on the critical path yet" decision rather
        # than a permanent one. When the suite is green again, drop this
        # condition and let PRs run it.
        if: >-
          needs.changes.outputs.e2e_scope != 'skip' &&
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          E2E_SCOPE: ${{ needs.changes.outputs.e2e_scope }}
          E2E_FILES: ${{ needs.changes.outputs.e2e_files }}
        run: |
          set -o pipefail
          # `xvfb-run` is the wrapper around Xvfb, which is a LINUX virtual
          # display server. The macOS and Windows runners have no Xvfb, so
          # asking for it there is `command not found` — exit 127 — and the
          # suite has never actually started on two of the three platforms
          # this matrix claims to cover. Measured on run 39643430577: the
          # macOS and Windows build jobs both died on this line within a
          # second, before a single spec ran, and the nightly's own macOS leg
          # was reported as `cancelled` rather than failed — which is what a
          # crash in a job that depends on a crashing job looks like.
          #
          # Linux keeps the virtual display (Electron needs one there); the
          # other two run the suite directly, because their runners have a
          # window server of their own.
          run_e2e() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a "$@"
            else
              "$@"
            fi
          }
          if [ "$E2E_SCOPE" = "full" ]; then
            run_e2e npm run test:e2e
          else
            mapfile -t e2e_files < <(node -e 'for (const file of JSON.parse(process.argv[1])) console.log(file)' "$E2E_FILES")
            if [ "${#e2e_files[@]}" -eq 0 ]; then
              echo "E2E scope was changed but no spec files were selected" >&2
              exit 1
            fi
            run_e2e npm run test:e2e -- "${e2e_files[@]}"
          fi

      - name: Package (macOS only)
        # Run the full electron-builder packaging on macOS so afterPack path
        # bugs (which only manifest inside the .app bundle) are caught on
        # every scheduled cross-platform run, not only on release tags.
        #
        # `--publish never` is the fix, and it is load-bearing rather than
        # decoration. electron-builder.yml declares a `github` publish provider,
        # and with NO publish flag on the command line PublishManager infers
        # one: on a push event `isPullRequest()` is false (GITHUB_BASE_REF is
        # unset), `getCiTag()` is null for a branch build, so `isCI` promotes
        # the policy to `onTagOrDraft` and every produced artifact is scheduled
        # for upload. Constructing the GitHub publisher then throws
        # "GitHub Personal Access Token is not set" and the job exits 1 —
        # AFTER the .app/DMG/zip exist and afterPack has verified the agent
        # bundle inside the package, so the parity step below never ran once.
        # Run 37194425248 is exactly that failure.
        #
        # A verification run has no business publishing, so publishing is
        # removed from the run rather than tolerated in it: no GH_TOKEN is
        # added, and the exit code stays the packaging exit code. release.yml
        # passes the symmetric `--publish always` alongside GH_TOKEN for the
        # real release, so the release path is untouched.
        #
        # electron-builder is invoked directly, the same shape release.yml uses
        # after its own `Build application` step. That drops the second
        # `npm run electron:build` that `npm run electron:pack:mac` re-ran on
        # top of the `Build application` step above: same build output, same
        # artifacts and same afterPack verification, one build instead of two.
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --config electron-builder.yml --publish never

      - name: Verify packaged artifacts (macOS only)
        if: matrix.os == 'macos-latest'
        run: node scripts/verify-packaged-parity.mjs --platform mac

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            dist/
            dist-electron/
            packages/host/bundle/
          retention-days: 7
