name: Model catalog refresh

# The built-in model directory (packages/ai/src/providers/*.models.ts) drifts
# out of date within weeks: vendors rotate model names, retire ids and reprice
# the same model. This workflow refreshes it from the two public catalogues
# the sync script reads (models.dev for vendor-direct ids, OpenRouter for the
# proxy-side ones). Scheduled model-data-only updates may merge unattended
# after the targeted validation below. Other changes still use normal PRs.
#
# Knobs:
#   * when   — `schedule.cron` below (21:30 Beijing time). GitHub delays
#               scheduled runs under load, so read it as "some time that
#               night", not as a deadline.
#   * how    — packages/ai/scripts/sync-models.mjs scans each shard's full
#               upstream catalogue and separates discovery from admission:
#               every new id is reported, but only ids that pass the admission
#               rules (not deprecated upstream, tool-capable, text-in/text-out,
#               released within the recency window) are written. Checked-in ids
#               are kept for as long as upstream still serves them.
#   * merge  — automatic after targeted validation; protection still applies.
#
# A pull request with no added and no removed model id is normal. OpenRouter
# quotes some models with a converted price that drifts continuously (observed:
# deepseek/deepseek-v4-pro moved ~2.6% within twenty minutes), so the openrouter
# shard alone can be enough to open a pull request on a night when no vendor
# shipped anything. The price is what upstream says, so it is written down
# rather than rounded away.
#
# Opening the pull request needs a token that may create pull requests. The
# repository enables "Allow GitHub Actions to create and approve pull requests",
# so the built-in GITHUB_TOKEN can do it; a NIGHTLY_PR_TOKEN secret, if the
# repository has one, takes precedence.
on:
  schedule:
    # 21:30 Beijing time (UTC+8). Late enough that the vendors' own catalogue
    # updates have landed, early enough to be reviewed the next morning.
    - cron: '30 13 * * *'
  # Manual trigger: the same path, for the morning after a vendor announcement
  # and for re-running a night that failed.
  workflow_dispatch:

# Least privilege: push one branch, open one pull request, touch nothing else.
permissions:
  contents: write
  pull-requests: write

# One refresh at a time. A nightly run that overlaps the next one would race
# on the same branch; cancelling the older run instead would leave the branch
# pointing at a half-finished refresh.
concurrency:
  group: model-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh model catalog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The branch is force-pushed, so the history must be writable, and
          # the diff quoted in the pull request is measured against the merge
          # base with the current master rather than against this checkout.
          ref: master
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      # No `npm ci` yet: the sync script is plain node and only fetches two
      # public JSON documents. Installing the workspace before knowing whether
      # anything changed would spend most of this job's minutes on a night
      # that has nothing to report.
      #
      # A failing fetch exits non-zero, so an upstream outage ends the run with
      # a red job and no pull request — the directory is never rewritten from a
      # half-read catalogue.
      #
      # The console output and the Markdown report are both kept: the report is
      # the discovery record (admitted, held with reasons, removed, changed)
      # and becomes the pull request body, whether or not the directory changed.
      - name: Refresh the model directory from upstream
        run: |
          set -euo pipefail
          node packages/ai/scripts/sync-models.mjs --write \
            --report="$RUNNER_TEMP/model-report.md" \
            | tee "$RUNNER_TEMP/sync-output.txt"

      # A night with no directory diff still has a discovery report — a new
      # upstream model may be held rather than admitted — so the summary is
      # written regardless of the next step's outcome. The file is absent when
      # the upstream fetch failed, in which case the job is already red.
      - name: Add the discovery report to the job summary
        if: always()
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/model-report.md" ]; then
            cat "$RUNNER_TEMP/model-report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '上游抓取失败，本次没有生成发现报告。' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Detect whether the directory changed
        id: detect
        run: |
          set -euo pipefail
          if git diff --quiet -- packages/ai/src/providers; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "model directory unchanged — nothing to propose"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- packages/ai/src/providers
          fi

      - name: Install dependencies
        if: steps.detect.outputs.changed == 'true'
        run: npm ci

      # The worker bundle is assembled from the built dist/ tree, so the
      # packages have to be built before anything reads them. This also type
      # checks the refreshed shards: the build runs tsc over packages/ai, so a
      # catalogue entry that does not fit the Model type fails here instead of
      # shipping.
      - name: Build the Host dependency closure
        if: steps.detect.outputs.changed == 'true'
        run: node scripts/build-packages.mjs --target @duya/host

      # The governance suite is what makes this safe to do unattended: it
      # rejects a directory whose entries lost their thinking ladder, whose
      # prices are off by a factor of a million, or whose model ids are
      # duplicated inside one list.
      - name: Model directory self-check
        if: steps.detect.outputs.changed == 'true'
        run: npx vitest run --root . packages/ai/test

      # The worker bundle is tracked in git and the freshness gate compares it
      # against the first-party inputs that changed since the bundle commit.
      # A refresh that changes packages/ai/src/providers without rebuilding
      # the bundle therefore turns the gate red on the pull request.
      - name: Rebuild the worker bundle
        if: steps.detect.outputs.changed == 'true'
        run: npm run bundle:worker

      # The build regenerates a tracked artefact (packages/capabilities/src/
      # ModuleTool/inline-content.ts). It is not part of this refresh, and
      # leaving it modified would make the bundle gate below report the bundle
      # as stale for a change nobody made. Restore every tracked file the
      # build touched except the two paths this refresh owns.
      - name: Restore files the build regenerated
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          stray="$(git diff --name-only -- . \
            ':(exclude)packages/ai/src/providers' \
            ':(exclude)packages/host/bundle')"
          if [ -n "$stray" ]; then
            echo "restoring build-regenerated files:"
            echo "$stray"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              git checkout -- "$file"
            done <<< "$stray"
          fi

      - name: Commit the refreshed directory
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/ai-model-catalog-nightly
          git add packages/ai/src/providers packages/host/bundle
          git commit -m "chore(ai): refresh model catalog from upstream"

      # The freshness gate is a git judgement: it compares the committed bundle
      # against the first-party inputs that changed after the bundle commit.
      # Validate the committed bundle BEFORE publishing the automation branch.
      - name: Worker bundle freshness (bundle:verify)
        if: steps.detect.outputs.changed == 'true'
        run: npm run bundle:verify

      # Record model additions and removals in the PR for auditability.
      # Prevent the scheduled job from slipping in source-code or workflow edits.
      - name: Verify catalog-only change scope
        if: steps.detect.outputs.changed == 'true'
        run: |
          set -euo pipefail
          unexpected="$(git diff-tree --no-commit-id --name-only -r HEAD | grep -Ev '^(packages/ai/src/providers/[^/]+\.models\.ts|packages/host/bundle/[^/]+)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected files in automated update:"
            echo "$unexpected"
            exit 1
          fi

      - name: Push validated catalog branch
        if: steps.detect.outputs.changed == 'true'
        run: git push --force origin chore/ai-model-catalog-nightly

      # The discovery report is the decision-relevant part of a refresh: a new
      # id means a new model is now offered in the settings, a held id is one a
      # human may choose to admit, and a removed id is one that is gone.
      - name: Open or update the pull request
        if: steps.detect.outputs.changed == 'true'
        env:
          # A PAT wins when the repository has one: creating a pull request is
          # the one operation the built-in GITHUB_TOKEN is refused by default
          # (Settings → Actions → General → "Allow GitHub Actions to create
          # and approve pull requests"). Updating an existing pull request is
          # allowed either way, so a repository that has one only needs the
          # token for the very first night.
          GH_TOKEN: ${{ secrets.NIGHTLY_PR_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: chore/ai-model-catalog-nightly
        run: |
          set -euo pipefail
          node <<'EOF' > "$RUNNER_TEMP/pr-body.md"
          const { execFileSync } = require('node:child_process');
          const { existsSync, readFileSync } = require('node:fs');

          // The sync script writes the discovery report. It is the body:
          // admitted ids, held ids with reasons, removed ids and field changes,
          // per shard. The file is absent only when the upstream fetch failed,
          // in which case this step never runs.
          const reportPath = `${process.env.RUNNER_TEMP}/model-report.md`;
          const report = existsSync(reportPath)
            ? readFileSync(reportPath, 'utf8').trim()
            : '（本次刷新未生成发现报告。）';

          // The report lists every discovered id, so it grows with the
          // catalogue. GitHub rejects a pull request body over 65,536
          // characters; the job summary keeps the full report.
          const MAX_BODY = 60000;
          const body =
            report.length > MAX_BODY
              ? `${report.slice(0, MAX_BODY)}\n\n…（报告已截断，完整清单见本次 job 的 Summary。）`
              : report;

          const stat = execFileSync(
            'git',
            ['diff', '--stat', 'origin/master...HEAD', '--', 'packages/ai/src/providers', 'packages/host/bundle'],
            { encoding: 'utf8' },
          ).trim();

          const lines = [
            '由 `.github/workflows/model-catalog.yml` 定时刷新，来源是 models.dev 与 OpenRouter 两个公开目录。',
            '**自动合并**：模型数据自检、Host 构建和 Worker Bundle 一致性校验通过后合入；异常保留 PR。',
            '发现结果里的「未收录」候选不会写入目录，需要人工判断是否加入准入规则。',
            '',
            body,
            '',
            '### 其余差异',
            '',
            '文件级 diff 与随源码重建的 worker bundle：',
            '',
            '```',
            stat,
            '```',
            '',
          ];
          process.stdout.write(lines.join('\n'));
          EOF

          # `gh pr edit` takes a pull request number, not a branch name, so the
          # existing pull request is looked up first. A closed pull request is
          # not found here, and the next night opens a new one.
          PR_NUMBER="$(gh pr view --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
            --json number --jq '.number' 2>/dev/null || true)"
          if [ -n "$PR_NUMBER" ]; then
            gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/pr-body.md"
            echo "updated pull request #$PR_NUMBER"
          else
            # The branch is already pushed, so a pull request that cannot be
            # created by the token is still one click away. The job fails
            # instead of passing quietly: a refresh that nobody is told about
            # is a refresh nobody reviews.
            COMPARE_URL="https://github.com/$GITHUB_REPOSITORY/compare/master...$BRANCH?expand=1"
            if ! gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" \
              --title "chore(ai): refresh model catalog from upstream" \
              --body-file "$RUNNER_TEMP/pr-body.md"; then
              echo "::error::This token may not create pull requests. Enable Settings → Actions → General → 'Allow GitHub Actions to create and approve pull requests', or add a PAT as the NIGHTLY_PR_TOKEN secret."
              echo "Open the pull request manually: $COMPARE_URL"
              exit 1
            fi
          fi

      - name: Merge validated catalog PR
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_PR_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: chore/ai-model-catalog-nightly
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr view --repo "$GITHUB_REPOSITORY" --base master --head "$BRANCH" --json number --jq '.number')"
          [ -n "$PR_NUMBER" ] || { echo "::error::Model catalog PR not found"; exit 1; }
          # No --admin: GitHub's required checks and branch protection are binding.
          # A protected bot PR may need approval: fail visibly and leave it open.
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --match-head-commit "$(git rev-parse HEAD)"
