id: query-optimization
name: Query Optimization
description: >-
  Inspect a slow Supabase query, propose indexes and rewrites, and apply
  them as a migration after user confirmation.
prompt: |
  Diagnose and optimize the slow Supabase query below.

  Query: {{query}}
  Symptoms: {{symptoms}}

  Steps to follow:
  1. Run the `postgres-best-practices` skill to inspect the
     affected tables via `supabase.list_tables` and
     `supabase.describe_table`. Build a mental map of the schema
     and the indexes that already exist.
  2. Inspect row estimates via `supabase.query.select` on
     `pg_class.reltuples` for the affected tables. Compare with the
     actual `COUNT(*)` on a small filter to detect stale statistics.
  3. Identify the missing index. Common patterns:
     - Foreign keys without a backing index (joins become seq scans).
     - `WHERE` predicates on unindexed columns.
     - `ORDER BY` without a matching index (sort spills to disk).
     - `jsonb` containment (`@>`) without a GIN index.
  4. Propose the index as a SQL snippet. If the query itself can be
     rewritten (e.g. replace a correlated subquery with a join, or
     push a filter into a CTE), propose the rewrite alongside the
     index.
  5. Show the user the proposed index and rewrite. After
     confirmation, hand off to the `migration-workflow` skill to
     wrap the index in a migration file and apply it via
     `supabase.apply_migration`.
  6. After apply, re-run the original query (or an `EXPLAIN
     ANALYZE` on a non-mutating variant) and report the latency
     delta.

  Constraint: do NOT run `EXPLAIN ANALYZE` on a mutating query —
  it executes the statement. Do NOT add a GIN index on `jsonb`
  without confirming the query pattern actually uses `@>` or key
  lookups (GIN indexes are large). Prefer partial indexes
  (`WHERE deleted_at IS NULL`) over full indexes for soft-delete
  patterns.
requiredCapabilities:
  - mcp:supabase
  - skill:postgres-best-practices
  - skill:migration-workflow
permissionTier: modify
