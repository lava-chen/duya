id: write-back-to-figma
name: Write Back to Figma
description: >-
  Post a comment or annotation back to a Figma file to close the loop
  with the designer. Always confirms the payload before writing.
prompt: |
  Write an annotation or comment back to the Figma file below.

  Figma URL: {{figma_url}}
  Target node: {{node_id}}
  Write type: {{write_type}}
  Text: {{text}}

  Steps to follow:
  1. Run the `write-back-to-figma` skill. Confirm the file key and
     node id are parsed correctly from the URL.
  2. Classify the write as a comment (threaded, notifies file
     collaborators) or an annotation (non-blocking marker). Default
     to annotation unless the user explicitly asked for a comment.
  3. Show the user the exact payload (text, target node, write type)
     and ask for confirmation before the write. The payload must be
     shown verbatim — no paraphrasing.
  4. After the write, report the permalink returned by the MCP server
     so the user can jump to it in Figma.
  5. Do not edit the design itself. Design edits are out of scope; the
     source of truth is the designer, not the agent.

  Constraint: do NOT batch-write without confirming each payload. Do
  NOT include code snippets, secrets, or internal identifiers the
  designer should not see. If the user asks to delete an existing
  comment, that requires destructive-tier confirmation and may need
  to be done in Figma directly.
requiredCapabilities:
  - mcp:figma
  - skill:write-back-to-figma
permissionTier: modify
