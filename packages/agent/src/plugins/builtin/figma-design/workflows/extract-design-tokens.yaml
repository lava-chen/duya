id: extract-design-tokens
name: Extract Design Tokens
description: >-
  Pull Figma variables and styles out of a file and project them into
  the project's token format (CSS custom properties, Tailwind config,
  etc.).
prompt: |
  Extract design tokens from the Figma file below and write them to the
  project's token file.

  Figma URL: {{figma_url}}
  Token format: {{token_format}}
  Target file: {{target_file}}

  Steps to follow:
  1. Run the `design-context-extraction` skill on the Figma URL,
     focusing on `figma.get_variable_defs` and `figma.list_styles`.
     Collect every variable collection (color, spacing, typography,
     effect) and every published style.
  2. Run the `design-system-mapping` skill to align each Figma
     variable/style with the project's existing token names. Surface
     conflicts (same name, different value) and gaps (Figma token with
     no project equivalent) as a checklist.
  3. Generate the token file in the requested format. Preserve
     existing token names where the mapping matched; add new tokens
     with names derived from the Figma variable name. Include a
     header comment pointing back to the Figma file.
  4. Show the proposed file content to the user before writing. Note
     any tokens that were renamed or merged so the user can audit the
     diff.
  5. Do not delete existing tokens even if they are unused. Unused
     tokens are a separate cleanup task.

  Constraint: do NOT overwrite the token file without showing the
  full diff. Do NOT round token values (12.5px stays 12.5px, not
  12px) unless the user explicitly asks for token rounding.
requiredCapabilities:
  - mcp:figma
  - skill:design-context-extraction
  - skill:design-system-mapping
permissionTier: write
